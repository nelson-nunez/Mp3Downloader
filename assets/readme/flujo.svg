<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="100%" role="img" aria-labelledby="t d">
  <title id="t">Flujo de descarga</title>
  <desc id="d">Un enlace de YouTube entra a la cola, se descarga el audio de mayor bitrate y FFmpeg lo convierte a MP3.</desc>
  <style>
    :root{--bg:#fbf7f4;--card:#ffffff;--fg:#1b1b24;--mut:#5d5d6b;--src:#d93a3a;--out:#0f9d82;--line:#e4dcd6}
    @media (prefers-color-scheme: dark){:root{--bg:#12141c;--card:#1b1e2a;--fg:#f4f1ee;--mut:#a3a3b2;--src:#ff6b6b;--out:#3ddbb5;--line:#2a2d3a}}
    .bg{fill:var(--bg)} .card{fill:var(--card);stroke:var(--line);stroke-width:2}
    .srcf{fill:var(--src)} .outf{fill:var(--out)}
    .num{font:700 22px 'Segoe UI',system-ui,sans-serif;fill:#111}
    .t{font:700 30px 'Segoe UI',system-ui,sans-serif;fill:var(--fg)}
    .sub{font:400 20px 'Segoe UI',system-ui,sans-serif;fill:var(--mut)}
    .ar{stroke:var(--mut);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
  </style>
  <rect class="bg" width="1200" height="250" rx="20"/>
  <rect class="card" x="40" y="50" width="250" height="150" rx="16"/>
  <circle class="srcf" cx="80" cy="92" r="20"/><text class="num" x="80" y="100" text-anchor="middle">1</text>
  <text class="t" x="112" y="100">Enlace</text>
  <text class="sub" x="64" y="160">URL de YouTube</text>
  <path class="ar" d="M296 125 h22 m-8 -8 l8 8 l-8 8"/>
  <rect class="card" x="330" y="50" width="250" height="150" rx="16"/>
  <circle class="srcf" cx="370" cy="92" r="20"/><text class="num" x="370" y="100" text-anchor="middle">2</text>
  <text class="t" x="402" y="100">Cola</text>
  <text class="sub" x="354" y="160">Pendientes sin duplicados</text>
  <path class="ar" d="M586 125 h22 m-8 -8 l8 8 l-8 8"/>
  <rect class="card" x="620" y="50" width="250" height="150" rx="16"/>
  <circle class="outf" cx="660" cy="92" r="20"/><text class="num" x="660" y="100" text-anchor="middle">3</text>
  <text class="t" x="692" y="100">Audio</text>
  <text class="sub" x="644" y="160">Stream de mayor bitrate</text>
  <path class="ar" d="M876 125 h22 m-8 -8 l8 8 l-8 8"/>
  <rect class="card" x="910" y="50" width="250" height="150" rx="16"/>
  <circle class="outf" cx="950" cy="92" r="20"/><text class="num" x="950" y="100" text-anchor="middle">4</text>
  <text class="t" x="982" y="100">MP3</text>
  <text class="sub" x="934" y="160">FFmpeg · libmp3lame</text>
</svg>
